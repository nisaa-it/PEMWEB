<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Seminar</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffe6f0, #fff5fa);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        h2 {
            text-align: center;
            color: #d63384;
            margin-bottom: 15px;
        }
        form {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            border: 2px solid #ffd6e8;
        }
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #b03060;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1.5px solid #f5c2e7;
            background-color: #fff9fc;
            font-size: 14px;
            transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #ff6fa5;
            outline: none;
            box-shadow: 0 0 5px #ff9fc9;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff80bf, #ffb6d9);
            color: white;
            font-weight: bold;
            font-size: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #ff5c9f, #ffa6d6);
            transform: scale(1.03);
        }
    </style>
</head>
<body>

    <form action="#" method="post">
        <h2>Formulir Pendaftaran Seminar</h2>
        <!-- Nama -->
        <label for="nama">Nama Lengkap:</label>
        <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>

        <!-- Email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="contoh@email.com" required>

        <!-- Nomor Telepon -->
        <label for="telepon">Nomor Telepon:</label>
        <input type="tel" id="telepon" name="telepon" placeholder="08xxxxxxxxxx" required>

        <!-- Pilihan Sesi Seminar -->
        <label for="sesi">Pilih Sesi Seminar:</label>
        <select id="sesi" name="sesi" required>
            <option value="">-- Pilih Sesi --</option>
            <option value="sesi1">Sesi 1: Teknologi</option>
            <option value="sesi2">Sesi 2: Kewirausahaan</option>
            <option value="sesi3">Sesi 3: Pendidikan</option>
        </select>

        <!-- Kolom Komentar -->
        <label for="komentar">Komentar / Pertanyaan:</label>
        <textarea id="komentar" name="komentar" rows="4" placeholder="Tulis komentar atau pertanyaan Anda..."></textarea>

        <!-- Tombol Submit -->
        <button type="submit">Daftar</button>
    </form>

</body>
</html>
