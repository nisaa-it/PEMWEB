<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <style>
    :root{
      --bg: #0f1724;
      --panel: #0b1220;
      --accent: #60a5fa;
      --accent-2: #7c3aed;
      --muted: #9aa4b2;
      --glass: rgba(255,255,255,0.04);
      --glass-2: rgba(255,255,255,0.02);
      --radius: 14px;
      --key-gap: 10px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(180deg, #071021 0%, #081427 50%);
      color:#e6eef6;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }

    #calculator{
      width:360px;
      max-width:95vw;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:var(--radius);
      padding:20px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.7), inset 0 1px 0 rgba(255,255,255,0.02);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.03);
    }

    #display{
      width:100%;
      height:64px;
      border-radius:10px;
      border: none;
      outline: none;
      padding:16px 18px;
      font-size:28px;
      text-align:right;
      background: linear-gradient(180deg, var(--glass), transparent);
      color:var(--accent);
      box-shadow: 0 6px 18px rgba(2,6,23,0.6);
      margin-bottom:16px;
    }

    #keys{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--key-gap);
    }

    #keys button{
      appearance:none;
      border: none;
      height:56px;
      border-radius:12px;
      font-size:18px;
      cursor:pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, background 160ms ease;
      box-shadow: 0 6px 16px rgba(2,6,23,0.55);
      background: linear-gradient(180deg, var(--glass-2), transparent);
      color: #e6eef6;
    }

    #keys button:active{transform: translateY(2px);}
    #keys button:hover{box-shadow: 0 10px 22px rgba(12,18,42,0.6);}

    /* special styling */
    #keys button.equal {
      grid-column: span 2;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      font-weight:700;
      font-size:20px;
    }
    #keys button.clear {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      color: var(--muted);
      font-weight:600;
    }
    #keys button.delete {
      background: linear-gradient(180deg, rgba(250,165,165,0.15), rgba(124,58,58,0.06));
      color: #fca5a5;
      font-weight:600;
    }
    #keys button.operator {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      color: var(--accent);
      font-weight:700;
    }
  </style>
</head>
<body>
  <div id="calculator">
    <input id="display" readonly>
    <div id="keys">
      <button onclick="appendToDisplay('+')" class="operator">+</button>
      <button onclick="appendToDisplay('7')">7</button>
      <button onclick="appendToDisplay('8')">8</button>
      <button onclick="appendToDisplay('9')">9</button>
      <button onclick="appendToDisplay('-')" class="operator">-</button>
      <button onclick="appendToDisplay('4')">4</button>
      <button onclick="appendToDisplay('5')">5</button>
      <button onclick="appendToDisplay('6')">6</button>
      <button onclick="appendToDisplay('*')" class="operator">*</button>
      <button onclick="appendToDisplay('1')">1</button>
      <button onclick="appendToDisplay('2')">2</button>
      <button onclick="appendToDisplay('3')">3</button>
      <button onclick="appendToDisplay('/')" class="operator">/</button>
      <button onclick="appendToDisplay('0')">0</button>
      <button onclick="appendToDisplay('.')">.</button>
      <button onclick="calculate()" class="equal">=</button>
      <button onclick="clearDisplay()" class="clear">C</button>
      <button onclick="deleteLast()" class="delete">DEL</button>
    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    function appendToDisplay(input){
      display.value += input;
    }
    function clearDisplay(){
      display.value = "";
    }
    function deleteLast(){
      display.value = display.value.slice(0, -1);
    }
    function calculate(){
      try {
        display.value = eval(display.value);
      } catch {
        display.value = "Error";
      }
    }
  </script>
</body>
</html>
